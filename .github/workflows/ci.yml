name: CI

# develop 으로의 PR과 develop 푸시에서 린트·테스트·타입체크를 돌린다.
# main 배포 경로의 게이트는 deploy.yml 안에 별도로 있다.
on:
  pull_request:
  push:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build
