<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      랩실 로고. .ico 에 16·32·48 을 함께 담아 브라우저가 쓰는 크기를 고르게 하고,
      큰 화면(탭 미리보기·바로가기)용으로 192·512 를 따로 둔다.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      본문 서체 Pretendard.

      시스템 서체(맑은 고딕·애플 SD 산돌고딕)는 기기마다 자모 굵기와 자간이 달라
      같은 화면이 윈도우에서만 촘촘해 보였다. 한 벌로 고정한다.

      동적 서브셋을 쓴다 — 화면에 실제로 나온 글자의 조각만 받아 온다. 한글 전체를
      담은 파일은 1MB 가 넘어서, 달력 한 장 보려고 그만큼 받게 할 수는 없다.

      못 받아 오면(사내망 차단 등) 아래 --font-sans 의 시스템 서체로 그냥 내려간다.
      글자가 안 보이는 일은 없다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <title>Lab Calendar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
